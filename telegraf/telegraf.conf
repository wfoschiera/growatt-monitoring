[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "solar"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["energy/solar"]
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  client_id = "telegraf-solar"
  data_format = "json"
  name_override = "growatt"
  json_string_fields = ["InverterStatus"]

# Only the inverter data goes to this bucket. Metrics you add from other config files
# (e.g. a telegraf.d/ directory) need their own output, so a host-metrics bucket can have
# its own retention without touching the inverter history.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  namepass = ["growatt"]
